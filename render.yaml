# Render Blueprint — WC2026 予想バトル
# ───────────────────────────────────────────────────────────────
# このリポジトリには複数プロジェクトがあるため、対象アプリは
# rootDir: worldcup-yosou で指定しています。
#
# 使い方:
#   1. Render ダッシュボード → New → Blueprint → このリポジトリを選択
#   2. 自動で Web Service と Postgres が作成されます
#   3. デプロイ後、Web Service の Environment で ADMIN_PASSWORD を
#      強固な値に設定（未設定でも仮値 admin2026 で動作します）
#
# 参考: https://render.com/docs/blueprint-spec

databases:
  - name: worldcup-db
    plan: free # 本番は starter 以上を推奨（free は保持期間に制限あり）
    databaseName: worldcup
    user: worldcup

services:
  - type: web
    name: worldcup-yosou
    runtime: node
    plan: free # 本番は starter 以上を推奨（free はアイドルでスリープ）
    rootDir: worldcup-yosou
    region: singapore # 日本に近いリージョン。DBと同一リージョンにすること
    # postinstall で prisma generate / build 内でも generate。
    # マイグレーションはデプロイ毎に適用する。
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worldcup-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false # ダッシュボードで設定（未設定時は仮値 admin2026）
      - key: ADMIN_SECRET
        generateValue: true # ランダムなシークレットを自動生成
      - key: NODE_VERSION
        value: "22"

  # ───────────────────────────────────────────────────────────────
  # Chatwork × Claude 連携ボット
  #   Chatworkの「アカウントイベント → ご自身へのメンション」Webhookを受け、
  #   メンションされた内容を Claude で処理して同じ部屋に返信する。
  #   デプロイ後の Webhook URL は:
  #     https://<このサービスのドメイン>/chatwork/webhook
  - type: web
    name: chatwork-claude-bot
    runtime: node
    plan: free # webhook受信のため本番は starter 以上を推奨（free はアイドルでスリープ）
    rootDir: chatwork-claude-bot
    region: singapore # 日本に近いリージョン
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: CHATWORK_API_TOKEN
        sync: false # ダッシュボードで設定（再発行したトークンを入れる）
      - key: CHATWORK_WEBHOOK_TOKEN
        sync: false # Webhook作成後に表示される署名検証用トークン
      - key: ANTHROPIC_API_KEY
        sync: false # AnthropicコンソールのAPIキー
      - key: CLAUDE_MODEL
        value: "claude-sonnet-4-6" # 必要なら claude-opus-4-8 等に変更可
      - key: NODE_VERSION
        value: "22"
