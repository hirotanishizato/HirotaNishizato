name: CI

on:
  pull_request:
    paths:
      - 'rmesse-saas/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'rmesse-saas/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmesse-saas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: rmesse-saas/backend/pyproject.toml
      - name: Show env
        run: python --version && pip --version
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' 'bcrypt<4.1'
      - name: Show installed packages
        run: pip list
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmesse-saas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rmesse-saas/frontend/package-lock.json
      - name: Show env
        run: node --version && npm --version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
