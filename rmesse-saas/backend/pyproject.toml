[project]
name = "rmesse-saas-backend"
version = "0.1.0"
description = "R-Messe inquiry management SaaS backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7",
    "bcrypt<4.1",
    "httpx>=0.27",
    "openai>=1.30",
    "google-generativeai>=0.7",
    "cryptography>=42.0",
    "slowapi>=0.1.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
# 日本語コメント/文字列を含むため余裕を持たせる
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
# B008: FastAPI の Depends() パターン、S105/S106: テストのハードコードパスワード,
# S101: assert, N806: テスト変数名 (tokA等), E501: 一部の日本語コメント
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "N806", "E501"]
"app/models/*" = ["UP042"]  # str-Enum パターン (Pydantic互換)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
